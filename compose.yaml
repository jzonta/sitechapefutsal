name: chapefutsal

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./app:/var/www/html
      - ./:/legacy:ro # site estático original (usado só pelo importador de notícias)
    depends_on:
      db:
        condition: service_healthy
    networks: [chape]

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [chape]

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chapefutsal}
      MYSQL_USER: ${DB_USERNAME:-chape}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [chape]

  node:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./app:/var/www/html
    networks: [chape]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [chape]

  # Comandos pontuais: docker compose run --rm composer <args>
  composer:
    image: composer:2
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./app:/app
      - composer-cache:/tmp/cache
    entrypoint: ["composer"]
    profiles: [tools]

networks:
  chape:

volumes:
  dbdata:
  composer-cache:
